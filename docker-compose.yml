services:
  database:
    image: pgvector/pgvector:pg16
    container_name: student-success-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_success}
      POSTGRES_USER: ${POSTGRES_USER:-student_success}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_success}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - student-success-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-success-api
    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-University Student Success Agent}
      APP_VERSION: ${APP_VERSION:-0.6.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8501"]}'
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      ENABLE_LLM_SMOKE_TEST: ${ENABLE_LLM_SMOKE_TEST:-true}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/app/data/documents}
      MAX_DOCUMENT_SIZE_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-10485760}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://student_success:student_success@database:5432/student_success}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_READINESS_TIMEOUT: ${DATABASE_READINESS_TIMEOUT:-3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      ASK_DEFAULT_TOP_K: ${ASK_DEFAULT_TOP_K:-5}
      ASK_MAX_TOP_K: ${ASK_MAX_TOP_K:-10}
      ASK_MIN_EVIDENCE_COUNT: ${ASK_MIN_EVIDENCE_COUNT:-1}
      ASK_MIN_RETRIEVAL_SCORE: ${ASK_MIN_RETRIEVAL_SCORE:-0.5}
      ASK_MAX_EVIDENCE_CHUNKS: ${ASK_MAX_EVIDENCE_CHUNKS:-5}
      ASK_EVIDENCE_MAX_CHARS_PER_CHUNK: ${ASK_EVIDENCE_MAX_CHARS_PER_CHUNK:-2000}
      ASK_MAX_QUESTION_CHARS: ${ASK_MAX_QUESTION_CHARS:-2000}
      CITATION_EXCERPT_MAX_CHARS: ${CITATION_EXCERPT_MAX_CHARS:-400}
      AGENT_MAX_TASKS: ${AGENT_MAX_TASKS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      AGENT_MAX_EVIDENCE_ITEMS: ${AGENT_MAX_EVIDENCE_ITEMS:-5}
      AGENT_MAX_PROVIDER_CALLS: ${AGENT_MAX_PROVIDER_CALLS:-5}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  student-success-postgres:
