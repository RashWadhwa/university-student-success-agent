services:
  database:
    image: pgvector/pgvector:pg16
    container_name: student-success-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_success}
      POSTGRES_USER: ${POSTGRES_USER:-student_success}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-student_success}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - student-success-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-success-api
    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-University Student Success Agent}
      APP_VERSION: ${APP_VERSION:-0.8.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8501"]}'
      AUTH_MODE: ${AUTH_MODE:-local}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      LOCAL_AUTH_ROLE: ${LOCAL_AUTH_ROLE:-admin}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-local-compose-rate-limit-key}
      PRIMARY_INSTITUTION_NAME: ${PRIMARY_INSTITUTION_NAME:-Harper Adams University}
      PRIMARY_INSTITUTION_CORPUS_MANIFEST: ${PRIMARY_INSTITUTION_CORPUS_MANIFEST:-/app/data/institutions/primary-corpus.json}
      PRIMARY_INSTITUTION_SOURCE_HOSTS: '${PRIMARY_INSTITUTION_SOURCE_HOSTS:-["www.harper-adams.ac.uk","cdn.harper-adams.ac.uk"]}'
      CORPUS_DOWNLOAD_TIMEOUT_SECONDS: ${CORPUS_DOWNLOAD_TIMEOUT_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_ORG_ID: ${OPENAI_ORG_ID:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-5}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      ENABLE_LLM_SMOKE_TEST: ${ENABLE_LLM_SMOKE_TEST:-true}
      EVAL_PROVIDER: ${EVAL_PROVIDER:-gemini}
      EVAL_MODEL: ${EVAL_MODEL:-gemini-3.1-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EVAL_MAX_CASES_PER_RUN: ${EVAL_MAX_CASES_PER_RUN:-50}
      EVAL_MAX_JUDGE_CALLS: ${EVAL_MAX_JUDGE_CALLS:-100}
      EVAL_TIMEOUT_SECONDS: ${EVAL_TIMEOUT_SECONDS:-30}
      EVALUATION_DATASET_PATH: ${EVALUATION_DATASET_PATH:-/app/data/evaluation/stage7-policy-cases.jsonl}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_EVENT_TIMEOUT_SECONDS: ${LANGFUSE_EVENT_TIMEOUT_SECONDS:-0.5}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/app/data/documents}
      MAX_DOCUMENT_SIZE_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-10485760}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://student_success:student_success@database:5432/student_success}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_READINESS_TIMEOUT: ${DATABASE_READINESS_TIMEOUT:-3}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      ASK_DEFAULT_TOP_K: ${ASK_DEFAULT_TOP_K:-5}
      ASK_MAX_TOP_K: ${ASK_MAX_TOP_K:-10}
      ASK_MIN_EVIDENCE_COUNT: ${ASK_MIN_EVIDENCE_COUNT:-1}
      ASK_MIN_RETRIEVAL_SCORE: ${ASK_MIN_RETRIEVAL_SCORE:-0.5}
      ASK_MAX_EVIDENCE_CHUNKS: ${ASK_MAX_EVIDENCE_CHUNKS:-5}
      ASK_EVIDENCE_MAX_CHARS_PER_CHUNK: ${ASK_EVIDENCE_MAX_CHARS_PER_CHUNK:-2000}
      ASK_MAX_QUESTION_CHARS: ${ASK_MAX_QUESTION_CHARS:-2000}
      CITATION_EXCERPT_MAX_CHARS: ${CITATION_EXCERPT_MAX_CHARS:-400}
      AGENT_MAX_TASKS: ${AGENT_MAX_TASKS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-20}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-1}
      AGENT_MAX_EVIDENCE_ITEMS: ${AGENT_MAX_EVIDENCE_ITEMS:-5}
      AGENT_MAX_PROVIDER_CALLS: ${AGENT_MAX_PROVIDER_CALLS:-5}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-success-frontend
    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
      ]
    depends_on:
      api:
        condition: service_healthy
    environment:
      FASTAPI_BASE_URL: ${FASTAPI_BASE_URL:-http://api:8000}
      FRONTEND_REQUEST_TIMEOUT_SECONDS: ${FRONTEND_REQUEST_TIMEOUT_SECONDS:-30}
      FRONTEND_MAX_UPLOAD_BYTES: ${FRONTEND_MAX_UPLOAD_BYTES:-10485760}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  student-success-postgres:
