name: CI and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: student_success
          POSTGRES_PASSWORD: student_success
          POSTGRES_DB: student_success_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U student_success -d student_success_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://student_success:student_success@localhost:5432/student_success_test
      DATABASE_URL: postgresql+asyncpg://student_success:student_success@localhost:5432/student_success_test
      LLM_PROVIDER: mock
      EVAL_PROVIDER: mock
      LANGFUSE_ENABLED: "false"
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q backend frontend migrations tests
      - run: alembic upgrade head
      - run: alembic current
      - run: python -m pytest -m "not integration" -q
      - run: python -m pytest -m integration -q
      - run: pip-audit
      - run: bandit -q -r backend frontend

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: student-success-agent:ci
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: student-success-agent:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
