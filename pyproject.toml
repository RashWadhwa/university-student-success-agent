[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-agent"
version = "0.8.0"
description = "Production-grade university student support agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.52.0",
    "httpx==0.28.1",
    "openai==2.46.0",
    "pypdf>=5.7,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "pgvector==0.5.0",
    "langfuse>=4.0,<5.0",
    "streamlit>=1.40,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
]

[project.scripts]
load-primary-corpus = "backend.corpus.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6.2,<8.0",
    "ruff==0.16.1",
    "pip-audit>=2.10,<3.0",
    "bandit>=1.9,<2.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=backend --cov-report=term-missing"
markers = [
    "integration: requires local PostgreSQL with the pgvector extension",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
